<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>База МОП</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0f1e; --panel:#111830; --panel-2:#17213f; --line:#243056;
  --blue:#2b7cf6; --blue-soft:rgba(43,124,246,.14);
  --mark:#eefa5c; --mark-ink:#0a0f1e;
  --green:#34d27b; --red:#ff5c5c; --amber:#ffb23e;
  --t1:#f2f5ff; --t2:#a3aed0; --t3:#66729a;
  --shadow:0 20px 60px rgba(0,0,0,.45);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#0a0f1e; --panel:#111830; --panel-2:#17213f; --line:#243056; --t1:#f2f5ff; --t2:#a3aed0; --t3:#66729a; } }
:root[data-theme="dark"]{ --bg:#0a0f1e; --panel:#111830; --panel-2:#17213f; --line:#243056; --t1:#f2f5ff; --t2:#a3aed0; --t3:#66729a; }
:root[data-theme="light"]{ --bg:#f3f6fd; --panel:#ffffff; --panel-2:#eef2fb; --line:#d9e1f2; --t1:#0e1530; --t2:#4a5578; --t3:#8691b0; --mark-ink:#0e1530; --shadow:0 20px 60px rgba(20,40,90,.18); }
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{height:100%;font-family:'Onest',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--t1);font-size:14.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--blue)}
.app{display:grid;grid-template-columns:268px 1fr;height:100%}

/* ── sidebar ── */
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:20px 18px 14px;border-bottom:1px solid var(--line)}
.brand .logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px}
.brand .pill{width:26px;height:14px;border-radius:10px;background:var(--blue);position:relative;flex-shrink:0}
.brand .pill::after{content:"";position:absolute;right:2px;top:2px;width:10px;height:10px;border-radius:50%;background:#fff}
.brand .sub{font-size:12px;color:var(--t3);margin-top:3px}
.search{margin:12px 14px 6px;position:relative}
.search input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 12px 8px 32px;outline:none;font-size:13.5px}
.search input:focus{border-color:var(--blue)}
.search::before{content:"⌕";position:absolute;left:11px;top:6px;color:var(--t3);font-size:16px}
.tabs-h{display:flex;justify-content:space-between;align-items:center;padding:12px 18px 6px;font-size:12px;color:var(--t3);font-weight:600}
.add{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--mark);font-size:18px;line-height:1;cursor:pointer;display:grid;place-items:center}
.add:hover{border-color:var(--mark)}
.tabs{flex:1;overflow-y:auto;padding:2px 0 12px}
.tab{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 16px;cursor:pointer;border-left:3px solid transparent;color:var(--t2);font-size:14px;position:relative}
.tab:hover{background:var(--blue-soft);color:var(--t1)}
.tab.on{border-left-color:var(--mark);background:var(--blue-soft);color:var(--t1);font-weight:600}
.tab .em{width:22px;text-align:center;flex-shrink:0}
.tab .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .cnt{font-size:11px;color:var(--t3);font-weight:500}
.tab .dots{opacity:0;border:none;background:transparent;color:var(--t3);cursor:pointer;padding:0 6px;font-size:16px;border-radius:6px}
.tab:hover .dots,.tab.on .dots{opacity:1}
.tab .dots:hover{color:var(--t1);background:var(--panel-2)}
.side-f{border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.status{font-size:11.5px;color:var(--t3);flex:1;min-width:120px}
.status b{font-weight:600}
.status.ok b{color:var(--green)} .status.loc b{color:var(--amber)}
.mini{font-size:12px;border:1px solid var(--line);background:transparent;color:var(--t2);border-radius:7px;padding:4px 9px;cursor:pointer}
.mini:hover{color:var(--t1);border-color:var(--t2)}

/* ── main ── */
.main{display:flex;flex-direction:column;min-height:0;min-width:0}
.head{display:flex;align-items:center;gap:12px;padding:18px 32px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.menu-btn{display:none;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;cursor:pointer}
.head h1{font-size:22px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.head h1 .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.head .kind{font-size:12px;color:var(--t3);font-weight:500;border:1px solid var(--line);border-radius:20px;padding:2px 10px;white-space:nowrap}
.btn{border-radius:9px;padding:8px 16px;font-size:13.5px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--t2);white-space:nowrap}
.btn:hover{color:var(--t1);border-color:var(--t2)}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.p:hover{filter:brightness(1.1)}
.btn.y{background:var(--mark);border-color:var(--mark);color:var(--mark-ink)}
.btn.d{color:var(--red);border-color:rgba(255,92,92,.35)}
.body{flex:1;overflow-y:auto;padding:20px 32px 60px;min-height:0}
.body.tool{padding:0;overflow:hidden;display:flex}
.frame{flex:1;border:0;width:100%;height:100%;background:var(--bg)}

.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.bar .in{max-width:280px}
.fchip{font-size:12.5px;border:1px solid var(--line);background:var(--panel);color:var(--t2);border-radius:30px;padding:5px 12px;cursor:pointer}
.fchip:hover{color:var(--t1)} .fchip.on{background:var(--blue);border-color:var(--blue);color:#fff}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.card-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.card-h .tt{font-weight:700;font-size:14.5px;flex:1;min-width:0}
.card-h .cat{font-size:11.5px;color:var(--t3);border:1px solid var(--line);border-radius:20px;padding:1px 9px;white-space:nowrap}
.acts{display:flex;gap:4px;flex-shrink:0}
.ic{border:1px solid transparent;background:transparent;color:var(--t3);border-radius:7px;padding:3px 8px;cursor:pointer;font-size:13px}
.ic:hover{color:var(--t1);border-color:var(--line);background:var(--panel-2)}
.ic.cp{border-color:var(--line);color:var(--t2);font-size:12px;padding:4px 11px}
.ic.cp.ok{color:var(--green);border-color:var(--green)}
.msg{padding:14px 16px;white-space:pre-wrap;font-size:14.5px;line-height:1.7;word-wrap:break-word}
mark,.hl{background:var(--mark);color:var(--mark-ink);padding:0 3px;border-radius:3px}

.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:22px}
.lk{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.lk:hover{border-color:var(--blue)}
.lk .tt{font-weight:700;font-size:14.5px;display:flex;gap:8px;align-items:flex-start}
.lk .tt span{flex:1}
.lk .ds{font-size:13px;color:var(--t2);flex:1}
.lk .url{font-size:12px;color:var(--blue);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none}
.lk .url:hover{text-decoration:underline}
.lk .row{display:flex;gap:6px;margin-top:4px}
.grp{font-size:13px;font-weight:700;color:var(--t2);margin:6px 0 10px}

.info .card-h .tt{font-size:16px}
.md{padding:14px 18px 16px;font-size:14.5px}
.md h2{font-size:17px;font-weight:800;margin:10px 0 6px}
.md h3{font-size:15px;font-weight:700;margin:8px 0 4px}
.md p{margin:0 0 8px}
.md ul,.md ol{margin:0 0 10px 20px}
.md li{padding:2px 0}
.md b{color:var(--t1)}
.md hr{border:none;border-top:1px solid var(--line);margin:12px 0}

.empty{border:1px dashed var(--line);border-radius:14px;padding:40px 24px;text-align:center;color:var(--t2)}
.empty h3{color:var(--t1);font-size:17px;margin-bottom:6px}
.empty p{margin-bottom:16px;font-size:14px}

.res{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:10px;cursor:pointer}
.res:hover{border-color:var(--blue)}
.res .w{font-size:12px;color:var(--t3);margin-bottom:2px}
.res .tt{font-weight:700}
.res .sn{font-size:13px;color:var(--t2);white-space:pre-wrap;max-height:4.8em;overflow:hidden}

/* modal */
.ov{position:fixed;inset:0;background:rgba(5,8,18,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.ov.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:100%;max-width:560px;max-height:90%;overflow-y:auto;box-shadow:var(--shadow)}
.modal h2{font-size:18px;font-weight:800;padding:18px 22px 4px}
.modal .mb{padding:10px 22px}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 22px 18px}
.fl{margin-bottom:12px}
.fl label{display:block;font-size:12.5px;color:var(--t2);font-weight:600;margin-bottom:5px}
.fl .hint{font-size:12px;color:var(--t3);margin-top:4px}
.in,.ta,.sel{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 12px;outline:none}
.in:focus,.ta:focus,.sel:focus{border-color:var(--blue)}
.ta{min-height:140px;resize:vertical;line-height:1.6}
.ta.big{min-height:260px}
.emo{display:flex;flex-wrap:wrap;gap:6px}
.emo button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:17px}
.emo button.on{border-color:var(--mark);background:var(--blue-soft)}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.type{border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:var(--bg)}
.type:hover{border-color:var(--blue)}
.type.on{border-color:var(--mark)}
.type b{display:block;font-size:14px;margin-bottom:2px}
.type span{font-size:12.5px;color:var(--t2);line-height:1.45;display:block}

.pop{position:fixed;z-index:60;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:190px;display:none}
.pop.on{display:block}
.pop button{display:block;width:100%;text-align:left;border:none;background:transparent;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:13.5px;color:var(--t1)}
.pop button:hover{background:var(--blue-soft)}
.pop button.d{color:var(--red)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:9px 16px;font-size:13.5px;z-index:70;display:none;box-shadow:var(--shadow)}
.toast.on{display:block}

:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:280px;z-index:40;transform:translateX(-100%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px)}
  .side.open{transform:none;box-shadow:var(--shadow)}
  .menu-btn{display:block}
  .head{padding:14px 16px}
  .body{padding:16px 16px 50px}
  .types{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <div class="logo"><span class="pill"></span>База МОП</div>
      <div class="sub">Скрипты, сообщения, ссылки и инфо</div>
    </div>
    <div class="search"><input id="q" placeholder="Поиск по всей базе"></div>
    <div class="tabs-h"><span>Вкладки</span><button class="add" id="addTab" title="Добавить вкладку" aria-label="Добавить вкладку">+</button></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="side-f">
      <div class="status" id="status">Загрузка…</div>
      <button class="mini" id="ghBtn" title="Режим редактора">✎ Редактор</button>
      <button class="mini" id="exportBtn" title="Скачать резервную копию">Экспорт</button>
      <button class="mini" id="importBtn" title="Загрузить из копии">Импорт</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
  </aside>

  <main class="main">
    <div class="head" id="head"></div>
    <div class="body" id="body"></div>
  </main>
</div>

<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div class="pop" id="pop"></div>
<div class="toast" id="toast"></div>
<input type="file" id="htmlFile" accept=".html,.htm,text/html" hidden>

<script>
/* ================= CONSTANTS ================= */
const TYPES = {
  messages:{icon:'💬', name:'Сообщения', desc:'Тексты касаний с категориями и кнопкой «Копировать»'},
  links:{icon:'🔗', name:'Ссылки', desc:'Название, ссылка и описание: таблицы, ленды, папки'},
  info:{icon:'📌', name:'Информация', desc:'Свободные блоки текста: тарифы, условия, FAQ'},
  tool:{icon:'🧰', name:'Инструмент', desc:'HTML-инструмент: скрипт продаж или свой файл'}
};
const EMOJI = ['💬','📝','🔗','📌','💰','🎯','📊','🧰','📚','⚡','🗂️','🧠','🔥','✅','📞','🎁','🤝','📣'];
const BUILTIN = { targetology:{name:'Скрипт продаж — Таргетология'} };
const GH_KEY = 'mop-base-gh';
const MAX_DOC = 900000;

/* ================= STATE ================= */
let tabs = [];            // [{id, title, emoji, type, order, items?, html?, builtin?}]
let activeId = null;
let mode = 'loading';     // 'site' | 'error'
let canWrite = false;     // true только когда подключён GitHub-токен
let gh = null;            // {owner, repo, branch, token}
let sha = null;           // версия data.json в GitHub
let saveTimer = null, saving = Promise.resolve(), pending = false, lastErr = '', savedAt = 0;
const ui = { filter:{}, search:{}, q:'' };

/* ================= UTILS ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const active = () => tabs.find(t => t.id === activeId);
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('on'),1800); }
function copyText(t, btn){
  const done=()=>{ if(btn){ const o=btn.textContent; btn.textContent='✓ Скопировано'; btn.classList.add('ok'); setTimeout(()=>{btn.textContent=o;btn.classList.remove('ok')},1500);} else toast('Скопировано'); };
  const fb=()=>{ const a=document.createElement('textarea'); a.value=t; document.body.appendChild(a); a.select(); try{document.execCommand('copy'); done();}catch(e){toast('Не удалось скопировать');} a.remove(); };
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(done).catch(fb); else fb();
}
/* подсветка переменных в сообщениях: ИМЯ, [..], (ссылка) */
function hlMsg(t){
  return esc(t).replace(/(ИМЯ|ТАРИФ|\[[^\]\n]{1,40}\]|\(ссылка[^)\n]*\))/g,'<mark>$1</mark>');
}
/* мини-markdown для инфо-блоков */
function inline(s){
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/==(.+?)==/g,'<mark>$1</mark>')
    .replace(/~~(.+?)~~/g,'<s style="color:var(--t3)">$1</s>')
    .replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
}
function md(src){
  const L = String(src||'').split('\n'); let out='', list=null;
  const close=()=>{ if(list){ out+=`</${list}>`; list=null; } };
  for(const raw of L){
    const l = raw.trimEnd();
    let m;
    if(!l.trim()){ close(); continue; }
    if(/^---+$/.test(l.trim())){ close(); out+='<hr>'; continue; }
    if((m=l.match(/^##\s+(.*)/))){ close(); out+=`<h3>${inline(m[1])}</h3>`; continue; }
    if((m=l.match(/^#\s+(.*)/))){ close(); out+=`<h2>${inline(m[1])}</h2>`; continue; }
    if((m=l.match(/^\s*[-•*]\s+(.*)/))){ if(list!=='ul'){close(); out+='<ul>'; list='ul';} out+=`<li>${inline(m[1])}</li>`; continue; }
    if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){ if(list!=='ol'){close(); out+='<ol>'; list='ol';} out+=`<li>${inline(m[1])}</li>`; continue; }
    close(); out+=`<p>${inline(l)}</p>`;
  }
  close(); return out;
}

/* ================= STORAGE (GitHub) ================= */
function setStatus(){
  const s=$('#status');
  if(mode==='loading'){ s.className='status'; s.textContent='Загрузка…'; return; }
  if(mode==='error'){ s.className='status loc'; s.innerHTML='<b>● Нет данных</b> · проверь data.json'; return; }
  if(canWrite){
    if(lastErr){ s.className='status loc'; s.innerHTML='<b style="color:var(--red)">● Не сохранено</b><br>'+esc(lastErr); return; }
    s.className='status ok';
    s.innerHTML = pending ? '<b>● Сохраняю…</b>' : savedAt ? '<b>● Сохранено ✓</b> · команда увидит после обновления страницы' : '<b>● Редактор</b>';
  }
  else { s.className='status'; s.innerHTML='<b>● Просмотр</b>'; }
}
const b64e = str => { const bytes=new TextEncoder().encode(str); let bin=''; for(let i=0;i<bytes.length;i+=0x8000) bin+=String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000)); return btoa(bin); };
const b64d = b64 => { const bin=atob(b64.replace(/\n/g,'')); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new TextDecoder().decode(u); };

function guessRepo(){
  const h=location.hostname, p=location.pathname.split('/').filter(Boolean);
  if(h.endsWith('.github.io')) return { owner:h.replace('.github.io',''), repo: p[0] && !p[0].includes('.') ? p[0] : h };
  return { owner:'', repo:'' };
}
function loadGh(){ try{ return JSON.parse(localStorage.getItem(GH_KEY)||'null'); }catch(e){ return null; } }
function saveGh(v){ try{ v?localStorage.setItem(GH_KEY,JSON.stringify(v)):localStorage.removeItem(GH_KEY); }catch(e){} }
function tfetch(url, opts={}, ms=20000){ const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms);
  return fetch(url,{...opts,signal:c.signal}).catch(e=>{ throw new Error(e.name==='AbortError'?'GitHub не отвечает — проверь интернет':'Нет связи с GitHub'); }).finally(()=>clearTimeout(t)); }
const apiUrl = () => `https://api.github.com/repos/${gh.owner}/${gh.repo}/contents/data.json?ref=${encodeURIComponent(gh.branch||'main')}`;
const apiHeaders = () => ({ 'Authorization':'Bearer '+gh.token, 'Accept':'application/vnd.github+json' });

async function fetchFromApi(){
  const r = await tfetch(apiUrl()+'&t='+Date.now(), { headers: apiHeaders(), cache:'no-store' });
  if(r.status===401||r.status===403) throw new Error('Токен не подходит или нет прав на репозиторий');
  if(r.status===404) throw new Error('Не найден data.json в '+gh.owner+'/'+gh.repo);
  if(!r.ok) throw new Error('GitHub ответил '+r.status);
  const j = await r.json(); sha = j.sha;
  return JSON.parse(b64d(j.content));
}
async function fetchPublic(){
  const g = guessRepo();
  if(g.owner && g.repo){
    try{
      const r = await tfetch(`https://api.github.com/repos/${g.owner}/${g.repo}/contents/data.json?t=${Date.now()}`,
        { headers:{ 'Accept':'application/vnd.github.raw+json' }, cache:'no-store' }, 8000);
      if(r.ok) return JSON.parse(await r.text());
    }catch(e){}
  }
  const r = await tfetch('data.json?t='+Date.now(), { cache:'no-store' });
  if(!r.ok) throw new Error('data.json не найден');
  return r.json();
}
function applyData(d){
  tabs = (Array.isArray(d)?d:(d.tabs||[])).map(t=>({...t}));
  tabs.sort((a,b)=>(a.order||0)-(b.order||0));
  if(!activeId || !tabs.find(t=>t.id===activeId)) activeId = (new URLSearchParams(location.hash.slice(1)).get('tab')) || tabs[0]?.id || null;
  if(!tabs.find(t=>t.id===activeId)) activeId = tabs[0]?.id || null;
}

function snapshot(){ return JSON.stringify({ version:1, updatedAt:new Date().toISOString(), tabs: tabs.map(t=>JSON.parse(JSON.stringify(t))) }, null, 1); }
function scheduleSave(immediate){
  if(!canWrite) return;
  pending = true; setStatus();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ saving = saving.then(doSave); }, immediate?50:1200);
}
async function doSave(attempt=0){
  const body = snapshot();
  if(body.length > MAX_DOC){ toast('База стала слишком большой — раздели крупные инструменты'); pending=false; setStatus(); return; }
  try{
    const r = await tfetch(`https://api.github.com/repos/${gh.owner}/${gh.repo}/contents/data.json`, {
      method:'PUT', headers:{...apiHeaders(),'Content-Type':'application/json'},
      body: JSON.stringify({ message:'База МОП: обновление', content:b64e(body), sha, branch:gh.branch||'main' })
    });
    if(r.status===409 || r.status===422){
      if(attempt<2){ const cur = await tfetch(apiUrl()+'&t='+Date.now(),{headers:apiHeaders(),cache:'no-store'}).then(x=>x.json()); sha=cur.sha; return doSave(attempt+1); }
      throw new Error('Конфликт версий — обнови страницу');
    }
    if(r.status===401) throw new Error('Токен недействителен — подключи редактор заново');
    if(r.status===403||r.status===404) throw new Error('У токена нет права записи: Contents → Read and write для этого репозитория');
    if(!r.ok) throw new Error('GitHub ответил '+r.status);
    const j = await r.json(); sha = j.content.sha;
    pending=false; lastErr=''; savedAt=Date.now(); setStatus();
  }catch(e){ pending=false; lastErr=e.message; setStatus(); toast('Не сохранилось: '+e.message); }
}
function persist(){ scheduleSave(false); }
async function removeTab(id){
  tabs = tabs.filter(t=>t.id!==id);
  if(activeId===id) activeId = tabs[0]?.id || null;
  scheduleSave(true); render();
}
function newTab(data){
  const id = uid();
  const t = {id, order: (Math.max(0,...tabs.map(x=>x.order||0))+1), ...data};
  tabs.push(t); activeId=id; scheduleSave(true); render();
}

async function init(){
  render();
  gh = loadGh();
  try{
    if(gh && gh.token){
      try{ applyData(await fetchFromApi()); canWrite=true; }
      catch(e){ toast(e.message+' — открыто в режиме просмотра'); canWrite=false; applyData(await fetchPublic()); }
    } else applyData(await fetchPublic());
    mode='site';
  }catch(e){ mode='error'; tabs=[]; }
  render();
}

let lastFrameKey = null;
function render(){
  setStatus();
  renderTabs();
  if(ui.q.trim()) { renderSearch(); return; }
  renderMain();
}
function countOf(t){ return (t.type==='tool') ? '' : (t.items||[]).length || ''; }
function renderTabs(){
  $('#addTab').style.display = canWrite ? '' : 'none';
  $('#importBtn').style.display = canWrite ? '' : 'none';
  $('#tabs').innerHTML = tabs.length ? tabs.map(t=>`
    <div class="tab ${t.id===activeId && !ui.q.trim()?'on':''}" data-act="open" data-id="${t.id}" tabindex="0">
      <span class="em">${esc(t.emoji||TYPES[t.type]?.icon)}</span>
      <span class="nm">${esc(t.title)}</span>
      <span class="cnt">${countOf(t)}</span>
      ${canWrite?`<button class="dots" data-act="tabmenu" data-id="${t.id}" aria-label="Действия с вкладкой">⋯</button>`:''}
    </div>`).join('') : `<div style="padding:10px 18px;color:var(--t3);font-size:13px">Вкладок пока нет</div>`;
}
function renderMain(){
  const t = active(), head=$('#head'), body=$('#body');
  const menu = `<button class="menu-btn" data-act="side" aria-label="Меню">☰</button>`;
  if(!t){
    lastFrameKey=null; body.className='body';
    head.innerHTML = `${menu}<h1><span class="t">База МОП</span></h1>`;
    if(mode==='error'){ body.innerHTML = `<div class="empty"><h3>Не удалось загрузить базу</h3><p>Проверь, что рядом с index.html лежит data.json, и обнови страницу.</p></div>`; return; }
    body.innerHTML = `<div class="empty"><h3>Здесь пока пусто</h3><p>Создай первую вкладку: сообщения, ссылки, информацию или инструмент.</p>${canWrite?'<button class="btn y" data-act="addtab">+ Новая вкладка</button>':''}</div>`;
    return;
  }
  const addLbl = {messages:'+ Сообщение', links:'+ Ссылка', info:'+ Блок'}[t.type];
  head.innerHTML = `${menu}<h1><span>${esc(t.emoji||'')}</span><span class="t">${esc(t.title)}</span></h1>
    <span class="kind">${TYPES[t.type]?.name||''}</span>
    ${canWrite && addLbl ? `<button class="btn p" data-act="additem">${addLbl}</button>`:''}
    ${canWrite && t.type==='tool' && !t.builtin ? `<button class="btn" data-act="replacehtml">Заменить HTML</button>`:''}`;

  if(t.type==='tool'){ renderTool(t, body); return; }
  lastFrameKey=null; body.className='body';
  if(t.type==='messages') body.innerHTML = viewMessages(t);
  else if(t.type==='links') body.innerHTML = viewLinks(t);
  else if(t.type==='info') body.innerHTML = viewInfo(t);
}
function renderTool(t, body){
  const key = t.id + ':' + (t.builtin || (t.html||'').length + ':' + (t.html||'').slice(0,64));
  if(lastFrameKey===key && body.querySelector('iframe')) return; // не перезагружать инструмент при синхронизации
  lastFrameKey = key; body.className='body tool';
  let html = '';
  if(t.builtin){
    body.innerHTML=''; const f=document.createElement('iframe'); f.className='frame'; f.title=t.title; f.setAttribute('allow','clipboard-write');
    f.src='tools/'+t.builtin+'.html'; body.appendChild(f); return;
  }
  html = t.html || '';
  if(!html){
    body.className='body';
    body.innerHTML = `<div class="empty"><h3>Инструмент пуст</h3><p>Загрузи .html-файл или вставь код.</p>${canWrite?'<button class="btn y" data-act="replacehtml">Загрузить HTML</button>':''}</div>`;
    return;
  }
  body.innerHTML=''; const f=document.createElement('iframe'); f.className='frame'; f.title=t.title; f.setAttribute('allow','clipboard-write'); f.srcdoc=html; body.appendChild(f);
}

function searchBar(t, placeholder){
  return `<input class="in" data-act="tabsearch" placeholder="${placeholder}" value="${esc(ui.search[t.id]||'')}">`;
}
function cats(t, field){ return [...new Set((t.items||[]).map(i=>(i[field]||'').trim()).filter(Boolean))]; }
function filterBar(t, field){
  const cs = cats(t, field); if(!cs.length) return '';
  const cur = ui.filter[t.id]||'';
  return `<button class="fchip ${!cur?'on':''}" data-act="filter" data-v="">Все</button>` + cs.map(c=>`<button class="fchip ${cur===c?'on':''}" data-act="filter" data-v="${esc(c)}">${esc(c)}</button>`).join('');
}
function visibleItems(t, field, keys){
  const q=(ui.search[t.id]||'').toLowerCase().trim(), f=ui.filter[t.id]||'';
  return (t.items||[]).map((it,i)=>({it,i})).filter(({it})=>(!f || (it[field]||'').trim()===f) && (!q || keys.some(k=>(it[k]||'').toLowerCase().includes(q))));
}
function itemActs(i, n, extra=''){
  return `<div class="acts">${extra}${canWrite?`
    <button class="ic" data-act="up" data-i="${i}" title="Выше" ${i===0?'disabled':''}>↑</button>
    <button class="ic" data-act="down" data-i="${i}" title="Ниже" ${i===n-1?'disabled':''}>↓</button>
    <button class="ic" data-act="edit" data-i="${i}" title="Изменить">✎</button>
    <button class="ic" data-act="del" data-i="${i}" title="Удалить">✕</button>`:''}</div>`;
}
function emptyState(t){
  const txt = {messages:['Сообщений пока нет','Добавь первое касание — и копируй его в один клик.'],links:['Ссылок пока нет','Добавь таблицы, ленды, папки и инструменты.'],info:['Блоков пока нет','Добавь тарифы, условия, FAQ — всё, что нужно держать под рукой.']}[t.type];
  return `<div class="empty"><h3>${txt[0]}</h3><p>${txt[1]}</p>${canWrite?'<button class="btn y" data-act="additem">+ Добавить</button>':''}</div>`;
}

function viewMessages(t){
  if(!(t.items||[]).length) return emptyState(t);
  const n=t.items.length, vis=visibleItems(t,'cat',['title','text','cat']);
  return `<div class="bar">${searchBar(t,'Поиск в сообщениях')}${filterBar(t,'cat')}</div>` +
    (vis.length ? vis.map(({it,i})=>`
      <div class="card">
        <div class="card-h"><div class="tt">${esc(it.title||'Без названия')}</div>${it.cat?`<span class="cat">${esc(it.cat)}</span>`:''}
          ${itemActs(i,n,`<button class="ic cp" data-act="copy" data-i="${i}">Копировать</button>`)}</div>
        <div class="msg">${hlMsg(it.text)}</div>
      </div>`).join('') : `<div class="empty"><p>Ничего не найдено</p></div>`);
}
function viewLinks(t){
  if(!(t.items||[]).length) return emptyState(t);
  const n=t.items.length, vis=visibleItems(t,'group',['title','url','desc','group']);
  const groups = {}; vis.forEach(x=>{ const g=(x.it.group||'').trim()||'Без группы'; (groups[g]=groups[g]||[]).push(x); });
  const names = Object.keys(groups); const single = names.length===1 && names[0]==='Без группы';
  return `<div class="bar">${searchBar(t,'Поиск по ссылкам')}${filterBar(t,'group')}</div>` +
    (vis.length ? names.map(g=>`${single?'':`<div class="grp">${esc(g)}</div>`}<div class="links">${groups[g].map(({it,i})=>{
      const url = /^https?:\/\//i.test(it.url||'') ? it.url : (it.url?'https://'+it.url:'');
      return `<div class="lk">
        <div class="tt"><span>${esc(it.title||'Без названия')}</span>${itemActs(i,n)}</div>
        ${it.desc?`<div class="ds">${esc(it.desc)}</div>`:'<div class="ds"></div>'}
        ${url?`<a class="url" href="${esc(url)}" target="_blank" rel="noopener">${esc(it.url)}</a>`:''}
        ${url?`<div class="row"><a class="btn p" style="padding:6px 12px;font-size:12.5px;text-decoration:none" href="${esc(url)}" target="_blank" rel="noopener">Открыть</a><button class="ic cp" data-act="copylink" data-i="${i}">Копировать ссылку</button></div>`:''}
      </div>`;}).join('')}</div>`).join('') : `<div class="empty"><p>Ничего не найдено</p></div>`);
}
function viewInfo(t){
  if(!(t.items||[]).length) return emptyState(t);
  const n=t.items.length, vis=visibleItems(t,'__none',['title','body']);
  return `<div class="bar">${searchBar(t,'Поиск в блоках')}</div><div class="info">` +
    (vis.length ? vis.map(({it,i})=>`
      <div class="card">
        <div class="card-h"><div class="tt">${esc(it.title||'Без названия')}</div>${itemActs(i,n,`<button class="ic cp" data-act="copy" data-i="${i}">Копировать</button>`)}</div>
        <div class="md">${md(it.body)}</div>
      </div>`).join('') : `<div class="empty"><p>Ничего не найдено</p></div>`) + `</div>`;
}

function renderSearch(){
  const q = ui.q.toLowerCase().trim(); lastFrameKey=null;
  const res=[];
  tabs.forEach(t=>{
    if(t.title.toLowerCase().includes(q)) res.push({t, title:t.title, sn:TYPES[t.type]?.name||''});
    (t.items||[]).forEach(it=>{
      const hay=[it.title,it.text,it.body,it.desc,it.url,it.cat,it.group].join(' ').toLowerCase();
      if(hay.includes(q)) res.push({t, title:it.title||'Без названия', sn:it.text||it.body||it.desc||it.url||''});
    });
  });
  $('#head').innerHTML = `<button class="menu-btn" data-act="side">☰</button><h1><span class="t">Поиск: «${esc(ui.q)}»</span></h1><span class="kind">${res.length} совпад.</span>`;
  const b=$('#body'); b.className='body';
  b.innerHTML = res.length ? res.map(r=>`<div class="res" data-act="gores" data-id="${r.t.id}"><div class="w">${esc(r.t.emoji||'')} ${esc(r.t.title)}</div><div class="tt">${esc(r.title)}</div><div class="sn">${esc(String(r.sn).slice(0,220))}</div></div>`).join('')
    : `<div class="empty"><h3>Ничего не найдено</h3><p>Попробуй другое слово.</p></div>`;
}

  info:[['title','Заголовок','in','Например: Тарифы'],['body','Текст','ta big','# Заголовок\n**жирный**, ==выделение==\n- пункт списка']]

}
function confirmModal(text, onYes){
  openModal(`<h2>Точно?</h2><div class="mb"><p style="color:var(--t2)">${text}</p></div><div class="mf"><button class="btn" data-act="mclose">Отмена</button><button class="btn d" id="mYes">Удалить</button></div>`);
  $('#mYes').onclick=()=>{ closeModal(); onYes(); };
}

/* tab menu popover */
function tabMenu(id, anchor){
  const t=tabs.find(x=>x.id===id); if(!t) return;
  const i=tabs.indexOf(t), p=$('#pop');
  p.innerHTML = `<button data-pm="edit">Переименовать / иконка</button>
    ${t.type==='tool'?`<button data-pm="html">${t.builtin?'Заменить на свой HTML':'Заменить HTML'}</button>`:''}
    <button data-pm="up" ${i===0?'disabled':''}>Переместить выше</button>
    <button data-pm="down" ${i===tabs.length-1?'disabled':''}>Переместить ниже</button>
    <button data-pm="del" class="d">Удалить вкладку</button>`;
  const r=anchor.getBoundingClientRect();
  p.style.left=Math.min(r.left, innerWidth-210)+'px'; p.style.top=Math.min(r.bottom+4, innerHeight-230)+'px'; p.classList.add('on');
  p.onclick=e=>{
    const a=e.target.closest('[data-pm]')?.dataset.pm; if(!a) return; p.classList.remove('on');
    if(a==='edit') tabModal(t);
    if(a==='html'){ activeId=t.id; render(); htmlModal(t); }
    if(a==='up'||a==='down'){ const j=a==='up'?i-1:i+1; const o=tabs[j]; if(!o) return;
      const oa=t.order||i, ob=o.order||j; t.order=ob; o.order=oa; if(t.order===o.order){ t.order=j; o.order=i; }
      tabs.sort((x,y)=>(x.order||0)-(y.order||0)); persist(t,true); persist(o,true); render(); }
    if(a==='del') confirmModal(`Вкладка «${esc(t.title)}» и всё её содержимое будут удалены.`, ()=>removeTab(t.id));
  };
}

/* ================= EVENTS ================= */
document.addEventListener('click', e=>{
  const pop=$('#pop'); if(pop.classList.contains('on') && !e.target.closest('#pop') && !e.target.closest('[data-act="tabmenu"]')) pop.classList.remove('on');
  if(e.target===$('#ov')) closeModal();
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act, t=active(), i=el.dataset.i!=null?+el.dataset.i:null;
  switch(act){
    case 'open': if(e.target.closest('.dots')) return; activeId=el.dataset.id; history.replaceState(null,'','#tab='+activeId); ui.q=''; $('#q').value=''; $('#side').classList.remove('open'); render(); break;
    case 'tabmenu': e.stopPropagation(); tabMenu(el.dataset.id, el); break;
    case 'addtab': tabModal(); break;
    case 'additem': itemModal(t); break;
    case 'edit': itemModal(t,i); break;
    case 'del': confirmModal('Элемент будет удалён без возможности восстановления.', ()=>{ t.items.splice(i,1); persist(t,true); render(); }); break;
    case 'up': case 'down': { const j=act==='up'?i-1:i+1; if(j<0||j>=t.items.length) return; [t.items[i],t.items[j]]=[t.items[j],t.items[i]]; persist(t,true); render(); break; }
    case 'copy': copyText(t.type==='info'?t.items[i].body:t.items[i].text, el); break;
    case 'copylink': copyText(t.items[i].url, el); break;
    case 'filter': ui.filter[t.id]=el.dataset.v; render(); break;
    case 'replacehtml': htmlModal(t); break;
    case 'mclose': closeModal(); break;
    case 'gores': activeId=el.dataset.id; ui.q=''; $('#q').value=''; render(); break;
    case 'side': $('#side').classList.toggle('open'); break;
  }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ closeModal(); $('#pop').classList.remove('on'); }
  if(e.key==='Enter' && e.target.matches('.tab')){ activeId=e.target.dataset.id; render(); }
});
document.addEventListener('input', e=>{
  if(e.target.matches('[data-act="tabsearch"]')){
    const t=active(); ui.search[t.id]=e.target.value; const pos=e.target.selectionStart; render();
    const inp=document.querySelector('[data-act="tabsearch"]'); if(inp){ inp.focus(); inp.setSelectionRange(pos,pos); }
  }
});
$('#q').addEventListener('input', e=>{ ui.q=e.target.value; render(); });
$('#addTab').onclick=()=>tabModal();
$('#ghBtn').onclick=()=>ghModal();

/* export / import */
$('#exportBtn').onclick=async()=>{
  const data = JSON.stringify({version:1, exportedAt:new Date().toISOString(), tabs}, null, 2);
  const name = 'baza-mop-'+new Date().toISOString().slice(0,10)+'.json';
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type:'application/json'})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
};
$('#importBtn').onclick=()=>{ const f=$('#importFile'); f.value=''; f.click(); };
$('#importFile').onchange=()=>{
  const file=$('#importFile').files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const parsed=JSON.parse(r.result); const list=Array.isArray(parsed)?parsed:parsed.tabs;
      if(!Array.isArray(list)) throw 0;
      confirmModal(`Добавить ${list.length} вкладок из копии? Текущие вкладки останутся.`, ()=>{
        let base=Math.max(0,...tabs.map(x=>x.order||0));
        list.forEach(src=>{ const {id,...rest}=src; const nid = uid(); const t={...rest,id:nid,order:++base}; tabs.push(t); });
        scheduleSave(true); render(); toast('Импорт готов');
      });
      $('#mYes').textContent='Импортировать'; $('#mYes').className='btn y';
    }catch(e){ toast('Не похоже на файл базы'); }
  };
  r.readAsText(file);
};

window.addEventListener('beforeunload',e=>{ if(pending){ e.preventDefault(); e.returnValue=''; } });
init();
</script>
